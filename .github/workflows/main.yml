name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_PRIVATE_KEY_PATH: ./rsa_key.p8
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-snowflake==1.8.*"
      - name: Write Snowflake private key
        run: printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ./rsa_key.p8
      - run: dbt deps
      - run: dbt debug --target qa
      - run: dbt build --target qa

  deploy-prod:
    needs: deploy-qa           # only starts after QA succeeds
    runs-on: ubuntu-latest
    environment: production     # <-- the approval gate lives here
    env:
      SNOWFLAKE_PRIVATE_KEY_PATH: ./rsa_key.p8
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-snowflake==1.8.*"
      - name: Write Snowflake private key
        run: printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ./rsa_key.p8
      - run: dbt deps
      - run: dbt debug --target prod
      - run: dbt build --target prod
